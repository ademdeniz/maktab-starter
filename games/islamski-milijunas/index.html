<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Islamic Millionaire</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#071426;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:620px;margin:auto;padding:12px} .head{text-align:center;padding:10px 4px}
h1{font-size:25px;margin:5px;color:#f4c84a} .sub{font-size:13px;color:#c7d3e8}
.panel{background:#0d203c;border:1px solid #28466e;border-radius:18px;padding:12px}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.pill{background:#142b4e;border:1px solid #36577e;border-radius:999px;padding:6px 9px;font-size:12px}
.gold{color:#ffd85e;font-weight:bold} .timer{height:8px;background:#223653;border-radius:10px;overflow:hidden;margin:8px 0 12px}
.timer>div{height:100%;background:#e9c44d;width:100%;transition:width .2s linear}
.q{font-size:19px;font-weight:700;line-height:1.35;text-align:center;padding:12px 4px;min-height:74px}
.answers{display:grid;gap:8px} .ans{width:100%;min-height:50px;border-radius:13px;border:1px solid #3b5d89;background:#102a4d;color:#fff;text-align:left;padding:10px 12px;font-size:15px}
.ans:disabled{opacity:.75} .correct{background:#176b45!important} .wrong{background:#8b2934!important}
.tools,.menu{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:11px}
button{min-height:43px;border-radius:11px;border:1px solid #45688f;background:#17365f;color:#fff;padding:8px 12px;font-weight:700}
.primary{background:#b78b17;color:#fff;border-color:#e5c85e} .msg{text-align:center;min-height:30px;padding-top:8px;font-weight:bold}
.screen{display:none} .screen.active{display:block} .start{text-align:center;padding:14px 4px}
.big{font-size:22px;color:#f4c84a;font-weight:800} .dbTop{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
input{width:100%;font-size:16px;padding:11px;border-radius:10px;border:1px solid #49698d;background:#071a31;color:#fff}
.dbList{margin-top:9px} .card{background:#0a1a31;border:1px solid #294a70;border-radius:12px;padding:10px;margin:8px 0;font-size:13px}
.card b{color:#f4c84a} .ok{color:#70e1a5;font-weight:bold;margin-top:5px}
.audience{font-size:13px;line-height:1.6} .footer{text-align:center;color:#9fb0c9;font-size:12px;padding:12px}
@media(max-width:380px){.wrap{padding:7px} h1{font-size:21px} .q{font-size:17px;padding:8px 2px} .ans{font-size:14px;min-height:46px;padding:8px} button{font-size:12px;padding:7px 9px}}
</style>

function choose(level,n){return shuffle(BANK.filter(x=>x.level===level)).slice(0,n)}
