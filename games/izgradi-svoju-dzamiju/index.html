const $=id=>document.getElementById(id);let deck=[],index=0,correct=0,answered=false,session=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function sound(ok){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();const t=ctx.currentTime;[0,1].forEach((v)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=ok?(v?880:660):(v?220:330);g.gain.setValueAtTime(.0001,t+v*.13);g.gain.exponentialRampToValueAtTime(.09,t+v*.13+.015);g.gain.exponentialRampToValueAtTime(.0001,t+v*.13+.12);o.connect(g);g.connect(ctx.destination);o.start(t+v*.13);o.stop(t+v*.13+.13)});setTimeout(()=>ctx.close(),600)}catch(e){}}
function update(){let parts=Math.min(16,Math.floor(correct/deck.length*16));if(correct===deck.length)parts=16;document.querySelectorAll('.part').forEach(e=>{const n=+e.dataset.p;e.classList.toggle('built',n<=parts);e.classList.toggle('next',n===parts+1)});$('counter').textContent=`Question ${Math.min(index+1,deck.length)}/${deck.length}`;$('score').textContent=`⭐ ${correct*10} points`;$('parts').textContent=`🧱 ${parts}/16 parts`;$('bar').style.width=(correct/deck.length*100)+'%';$('stage').textContent=parts===16?'🕌 The mosque is finished!':`${parts} of 16 parts built`}
function show(){if(index>=deck.length){end();return}answered=false;update();const item=deck[index];$('question').textContent=item.q;$('message').textContent='';$('info').textContent='Choose one of the four answers';$('answers').replaceChildren();shuffle(item.a.map((s,i)=>({s,ok:i===item.correct}))).forEach((opt,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+') '+opt.s;b.onclick=()=>choose(b,opt.ok);$('answers').append(b)})}
function choose(button,ok){if(answered)return;answered=true;const current=session;if(ok)correct++;sound(ok);button.classList.add(ok?'good':'bad');for(const b of $('answers').children){b.disabled=true;if(!ok&&b.textContent.slice(3)===deck[index].a[deck[index].correct])b.classList.add('good')}update();$('message').textContent=ok?'✅ Correct! A new part of the mosque is built.':'❌ Wrong. Look at the green answer.';$('message').style.color=ok?'#16864d':'#b13d36';setTimeout(()=>{if(session!==current)return;index++;show()},ok?950:1750)}
function end(){$('quiz').classList.add('hidden');$('finish').classList.remove('hidden');$('counter').textContent='Building finished';$('result').textContent=`Right answers: ${correct} of ${deck.length}. You scored ${correct*10} points and built ${Math.floor(correct/deck.length*16)} of 16 parts. ${correct===deck.length?'You built the whole mosque! 🕌':'Try again to finish the whole mosque!'}`}
function start(){session++;deck=shuffle([...BANK]).slice(0,Number($('total').value));index=0;correct=0;$('quiz').classList.remove('hidden');$('finish').classList.add('hidden');show()}
$('start').onclick=start;$('again').onclick=start;$('total').onchange=start;
$('download').onclick=()=>{const content='<!doctype html>\n'+document.documentElement.outerHTML.replace(/^<!doctype html>\s*/i,'');const blob=new Blob([content],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='build-your-mosque-A1.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)};
start();
