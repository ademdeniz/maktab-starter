*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 15%,#162d67 0,#071431 48%,#020713 100%);color:white;font-family:Arial,sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:16px}.top{text-align:center}.title{font-size:clamp(25px,5vw,46px);font-weight:900;letter-spacing:1px;text-shadow:0 0 15px #4a7cff}.sub{color:#d7c26b;margin:5px}
.hud{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}.pill{border:1px solid #d6b94b;border-radius:20px;padding:8px 13px;background:#071b43}

.msg{text-align:center;min-height:34px;margin:13px;font-weight:800;font-size:20px}.next{display:none;margin:12px auto;border:0;border-radius:24px;padding:12px 25px;font-weight:800;background:#d8b94a;color:#08122c}
.start{text-align:center;padding:45px 12px}.start button{font-size:22px;border:2px solid #e1c356;border-radius:28px;padding:14px 30px;background:#0c2861;color:white;font-weight:800}
.note{color:#cbd6f1;text-align:center;margin-top:15px}.audience{display:none;text-align:center;margin:10px}.bars{display:flex;align-items:end;justify-content:center;gap:18px;height:120px}.bar{width:45px;background:#d5b94d;min-height:3px}.lab{font-size:12px}

nly water", "B": "A toothbrush or a miswak", "C": "A towel", "D": "Soap"}, "answer": "B"}, {"q": "How many times do we rinse the nose?", "opts": {"A": "Once", "B": "Two times", "C": "Three times", "D": "Four times"}, "answer": "C"}, {"q": "In the usual way of making wudu, how many times do we wash the face?", "opts": {"A": "Once", "B": "Two times", "C": "Four times", "D": "Three times"}, "answer": "D"}, {"q": "Which arm do we wash first up to above the elbow?", "opts": {"A": "The right one", "B": "The left one", "C": "Both together", "D": "It is not important"}, "answer": "A"}, {"q": "How many times do we wash the right arm up to above the elbow?", "opts": {"A": "Once", "B": "Three times", "C": "Two times", "D": "Four times"}, "answer": "B"}, {"q": "What do we wash after the right arm?", "opts": {"A": "The feet", "B": "The face", "C": "The left arm up to above the elbow", "D": "The ears"}, "answer": "C"}, {"q": "What is masah?", "opts": {"A": "Washing the feet", "B": "Rinsing the nose", "C": "Washing the face", "D": "Wiping at least a quarter of the head with a wet hand"}, "answer": "D"}, {"q": "At least how much of the head do we wipe with a wet hand?", "opts": {"A": "At least a quarter of the head", "B": "Half of the head", "C": "The whole head, always", "D": "Only the forehead"}, "answer": "A"}, {"q": "What do we wipe after the masah of the head?", "opts": {"A": "The neck", "B": "The ears, inside and outside", "C": "The feet", "D": "The face"}, "answer": "B"}, {"q": "How is the neck wiped?", "opts": {"A": "Three times with the palms", "B": "With a wet cloth", "C": "Once with the backs of the fingers", "D": "It is neither washed nor wiped"}, "answer": "C"}, {"q": "What is good to recite after making wudu?", "opts": {"A": "The Shahadah", "B": "The Adhan", "C": "The Iqamah", "D": "Only Al-Fatiha"}, "answer": "A"}, {"q": "What are the compulsory actions of wudu called?", "opts": {"A": "The arkan of Salah", "B": "The sharts or fard parts of wudu", "C": "The pillars of ": "D"}, {"q": "Which of these breaks wudu during Salah?", "opts": {"A": "Laughing out loud in Salah", "B": "Reciting the Qur’an", "C": "Standing", "D": "Sajdah"}, "answer": "A"}, {"q": "How many prayers can we pray with one wudu?", "opts": {"A": "Only one", "B": "Several prayers, as long as nothing happens that breaks the wudu", "C": "Two at most", "D": "Only the fard of one prayer"}, "answer": "B"}, {"q": "Which ayah of the Qur’an speaks about the sharts of wudu?", "opts": {"A": "Al-Fatiha, 1", "B": "Al-Ikhlas, 1", "C": "Al-Baqarah, 255", "D": "Al-Ma’idah, 6"}, "answer": "D"}, {"q": "Who were Hasan and Husayn (RA)?", "opts": {"A": "The sons of Ali and Fatimah (RA) and grandsons of Muhammad, alayhis-salam", "B": "Allah’s messengers", "C": "Mu’adhins", "D": "Teachers at a madrasah"}, "answer": "A"}, {"q": "What did Hasan and Husayn notice about a man who was making wudu?", "opts": {"A": "That he had not called the Adhan", "B": "That he was not doing it correctly", "C": "That he had not prayed", "D": "That he had no water"}, "answer": "B"}, {"q": "How did Hasan and Husayn teach the man the correct way to make wudu?", "opts": {"A": "They told him off in front of everyone", "B": "They said nothing to him", "C": "They asked him to judge which of the two of them made wudu more beautifully, correctly and quickly", "D": "They sent him to another man"}, "answer": "C"}, {"q": "What did the man say to Hasan and Husayn after watching them make wudu?", "opts": {"A": "That they should redo their wudu", "B": "That only one of them had made wudu correctly", "C": "That he had not understood them", "D": "“Dear children, may Allah reward you, you have taught me how to make wudu.”"}, "answer": "D"}, {"q": "What is the first shart of Salah?", "opts": {"A": "Making wudu", "B": "Facing the Qiblah", "C": "Clean body, clothes and place of prayer", "D": "Niyyah"}, "answer": "C"}, {"q": "When especially should we take care of cleanliness?", "opts": {"A": "When we travel", "B": "When we sleep let quiz=[],i=0,score=0,correct=0,wrong=0,locked=false;
const shuffle=a=>{a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function pick(level,n){return shuffle(BANKS[level]).slice(0,n).map(x=>({...x,level}))}
function begin(){quiz=[...pick("A1",5),...pick("A2",10),...pick("A3",15)]; document.getElementById("start").style.display="none";document.getElementById("game").style.display="block";show()}
function show(){locked=false;let q=quiz[i]; prog.textContent=`Question ${i+1}/30`;lvl.textContent=`Level ${q.level}`;scoreEl();document.getElementById('question').textContent=q.q;msg.textContent="";aud.style.display="none";answers.innerHTML="";
let arr=shuffle(Object.keys(q.opts).map(k=>({text:q.opts[k],ok:k===q.answer})));
arr.forEach((o,idx)=>{let b=document.createElement("button");b.className="ans";b.dataset.ok=o.ok;b.innerHTML=`<b>${"ABCD"[idx]})</b> ${esc(o.text)}`;b.onclick=()=>choose(b);answers.appendChild(b)})}
function esc(s){let d=document.createElement("div");d.textContent=s;return d.innerHTML}
function scoreEl(){document.getElementById("score").textContent=`Points: ${score}`}
function tone(ok){let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?740:180;g.gain.setValueAtTime(.16,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.32);o.start();o.stop(c.currentTime+.33)}
function choose(b){if(locked)return;locked=true;let ok=b.dataset.ok==="true";if(ok){score+=10;correct++;b.classList.add("good");msg.textContent="Correct answer! +10 points";tone(true)}else{score-=3;wrong++;b.classList.add("bad");[...answers.children].find(x=>x.dataset.ok==="true")?.classList.add("good");msg.textContent="Wrong answer! −3 points";tone(false)}scoreEl();setTimeout(()=>advance(),1200)}
function half(){if(locked)return;halfBtn=document.getElementById("half");halfBtn.disabled=true;let bad=shuffle([...answers.children].filter(x=>x.dataset.ok==="false"));bad.slice(0,2).forEach(x=>x.classList.add("hide"))}
function teacher(){if(locked)return;document.getElementById("teach").disabled=true;let good=[...answers.children].find(x=>x.dataset.ok==="true");let label=good?good.innerText.split(")")[0]:"";msg.textContent=`The teacher (mu’allim) thinks the answer is ${label}.`}
function audience(){if(locked)return;document.getElementById("pub").disabled=true;let btns=[...answers.children],good=btns.findIndex(x=>x.dataset.ok==="true"),vals=[0,0,0,0];let main=55+Math.floor(Math.random()*21),rest=100-main;vals[good]=main;let others=[0,1,2,3].filter(x=>x!==good);for(let z=0;z<2;z++){let v=Math.floor(Math.random()*(rest+1));vals[others[z]]=v;rest-=v}vals[others[2]]=rest;bars.innerHTML="";vals.forEach((v,j)=>{bars.innerHTML+=`<div><div class="bar" style="height:${v}px"></div><div class="lab">${"ABCD"[j]} ${v}%</div></div>`});aud.style.display="block"}
function advance(){if(i<quiz.length-1){i++;show()}else{game.style.display="none";finish.style.display="block";final.textContent=`Total: ${score} points`;stats.textContent=`Correct answers: ${correct} • Wrong answers: ${wrong} • Maximum: 300 points`}}
</script></body></html>
