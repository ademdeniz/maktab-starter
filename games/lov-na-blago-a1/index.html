<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#332312;background:linear-gradient(#65c4dc 0 35%,#efd17d 35%);min-height:100vh}
main{max-width:940px;margin:auto;padding:10px 10px 28px}.top,.quiz{background:#fff5d7eF;border:4px solid #70461d;border-radius:22px;box-shadow:0 8px 20px #0003}.top{text-align:center;padding:10px}h1{font-family:Georgia,serif;color:#6a3d16;margin:0;font-size:clamp(27px,7vw,44px)}.by{font-weight:800;color:#285440}.stats{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:8px}.badge{background:#173f31;color:white;border:2px solid #e0b947;border-radius:99px;padding:6px 11px;font-weight:850}.prog{height:13px;background:#d7bf82;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#2d7950,#dfae31);transition:.35s}
.map{position:relative;margin:11px 0;border:5px solid #70461d;border-radius:25px;overflow:hidden;background:#50b2ca;box-shadow:0 8px 20px #0004}.map svg{width:100%;display:block;opacity:0}.prizeMap{background-position:center;background-size:cover;background-repeat:no-repeat}.fog{position:absolute;inset:0;background:radial-gradient(circle at 14% 76%,transparent 0 7%,#342414f2 10% 100%);transition:clip-path .6s,opacity .6s}.map[data-p="1"] .fog{background:radial-gradient(circle at 14% 76%,transparent 0 12%,#342414ed 17% 100%)}.map[data-p="2"] .fog{background:radial-gradient(circle at 20% 70%,transparent 0 18%,#342414e8 25% 100%)}.map[data-p="3"] .fog{background:radial-gradient(circle at 26% 64%,transparent 0 25%,#342414e3 33% 100%)}.map[data-p="4"] .fog{background:radial-gradient(circle at 33% 59%,transparent 0 31%,#342414dc 40% 100%)}.map[data-p="5"] .fog{background:radial-gradient(circle at 40% 54%,transparent 0 38%,#342414d5 48% 100%)}.map[data-p="6"] .fog{background:radial-gradient(circle at 48% 50%,transparent 0 45%,#342414cc 56% 100%)}.map[data-p="7"] .fog{background:radial-gradient(circle at 57% 47%,transparent 0 52%,#342414bf 64% 100%)}.map[data-p="8"] .fog{background:radial-gradient(circle at 66% 44%,transparent 0 59%,#342414aa 72% 100%)}.map[data-p="9"] .fog{background:radial-gradient(circle at 76% 42%,transparent 0 68%,#34241488 82% 100%)}.map[data-p="10"] .fog{opacity:0}
.lockmsg{position:absolute;inset:auto 10px 12px;display:flex;justify-content:center;pointer-events:none}.lockmsg span{background:#20160ddd;color:#fff;border:2px solid #dfb44c;border-radius:14px;padding:7px 11px;font-weight:900;text-align:center}
.quiz{padding:14px}.counter{text-align:center;font-weight:900;color:#795221}.quiz h2{text-align:center;font-size:clamp(19px,5vw,27px);margin:7px 0 13px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ans{min-height:58px;background:#fffdf6;border:2px solid #8c6a36;border-radius:15px;padding:10px;text-align:left;font-size:16px;font-weight:750;box-shadow:0 3px #b6965d}.ans.correct{background:#d8f2d4;border-color:#347a43}.ans.wrong{background:#f8d4cf;border-color:#a63e32}.feedback{min-height:29px;text-align:center;margin-top:9px;font-weight:900}.finish{display:none;text-align:center;padding:10px}.chest{font-size:85px}.restart{border:0;border-radius:14px;background:#174b38;color:white;padding:13px 19px;font-size:17px;font-weight:900}
@media(max-width:600px){.answers{grid-template-columns:1fr}.map{border-width:4px}.quiz{padding:11px}}

.tiles20{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:0;pointer-events:none;z-index:20;background:#17110b}
.coverTile{position:relative;background:#17110b;border:2px solid #4b351f;opacity:1;transition:opacity .55s,transform .55s;overflow:hidden}
.coverTile:after{content:"★";position:absolute;inset:0;display:grid;place-items:center;color:#c99b49;font-weight:900;font-size:clamp(18px,5vw,38px);text-shadow:0 2px 2px #000}
.coverTile.open{opacity:0;transform:scale(.82);pointer-events:none}

let deck=[],pos=0,correct=0,asked=0,score=0,locked=false;
const $=x=>document.getElementById(x);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDeck(){return shuffle(BANK.map((x,n)=>({id:n,q:x[0],a:x[1],c:x[2]})))}
function sound(ok){try{const A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?690:170;g.gain.setValueAtTime(.11,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.23);o.start();o.stop(c.currentTime+.24)}catch(e){}}
function nextItem(){if(pos>=deck.length){deck=makeDeck();pos=0}return deck[pos++]}
let current=null;

function prizeSVG(type){
 const common=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fff3c8"/><stop offset="1" stop-color="#ffd7e5"/></linearGradient></defs><rect width="900" height="450" fill="url(#bg)"/><circle cx="105" cy="78" r="42" fill="#fff" opacity=".5"/><circle cx="790" cy="75" r="62" fill="#fff" opacity=".45"/>`;
 let art="";
 if(type==="ice") art=`<g transform="translate(450 205)"><path d="M-70 50L0 190 70 50Z" fill="#d59a50" stroke="#704527" stroke-width="8"/><circle cx="-42" cy="15" r="62" fill="#ff91ad" stroke="#704527" stroke-width="7"/><circle cx="42" cy="15" r="62" fill="#fff0c4" stroke="#704527" stroke-width="7"/><circle cx="0" cy="-50" r="62" fill="#8bd39d" stroke="#704527" stroke-width="7"/></g>`;
 if(type==="candy") art=`<g transform="translate(450 205)"><path d="M-230 0l70-65 35 65-35 65zM230 0l-70-65-35 65 35 65z" fill="#ff8da5" stroke="#713b4a" stroke-width="8"/><rect x="-165" y="-82" width="330" height="164" rx="82" fill="#ffd35b" stroke="#713b4a" stroke-width="9"/><circle cx="-75" cy="-15" r="23" fill="#ef6f86"/><circle cx="0" cy="25" r="23" fill="#72c9b1"/><circle cx="78" cy="-18" r="23" fill="#8c83d9"/></g>`;
 if(type==="cake") art=`<g transform="translate(450 225)"><ellipse cx="0" cy="105" rx="210" ry="34" fill="#d4b17a"/><rect x="-175" y="-5" width="350" height="110" rx="20" fill="#f5b0bd" stroke="#74452d" stroke-width="8"/><rect x="-135" y="-90" width="270" height="85" rx="20" fill="#fff1c9" stroke="#74452d" stroke-width="8"/><circle cx="-65" cy="-108" r="17" fill="#e54b4b"/><circle cx="0" cy="-108" r="17" fill="#e54b4b"/><circle cx="65" cy="-108" r="17" fill="#e54b4b"/></g>`;
 if(type==="choc") art=`<g transform="translate(450 205) rotate(-5)"><rect x="-195" y="-120" width="390" height="240" rx="25" fill="#6b351d" stroke="#3e2115" stroke-width="10"/>${[-125,-40,45,130].map(x=>[-65,20,105].map(y=>`<rect x="${x-31}" y="${y-31}" width="62" height="62" rx="8" fill="#8b4b2a" stroke="#4d2818" stroke-width="5"/>`).join("")).join("")}</g>`;
 if(type==="lollipop") art=`<g transform="translate(450 185)"><rect x="-10" y="60" width="20" height="180" rx="10" fill="#f6f0df" stroke="#8c765e" stroke-width="5"/><circle cy="0" r="125" fill="#ff6b8a" stroke="#713b4a" stroke-width="9"/><path d="M-78-72C65-135 145-10 60 65C-10 125-115 62-78-5C-48-60 42-55 50-5C56 35 3 58-22 27" fill="none" stroke="#fff2a9" stroke-width="24" stroke-linecap="round"/></g>`;
 return common+art+`</svg>`;
}
const PRIZES=["ice","cake","choc","lollipop","candy"];
let chosenPrize="";
function setRandomPrize(){chosenPrize=PRIZES[Math.floor(Math.random()*PRIZES.length)];$("map").style.backgroundImage=`url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(prizeSVG(chosenPrize))}")`}


function buildTiles(){const t=$("tiles20");t.innerHTML="";t.style.background="#17110b";for(let i=0;i<20;i++){const d=document.createElement("div");d.className="coverTile";d.id="coverTile"+i;t.appendChild(d)}}
function start(){setRandomPrize();deck=makeDeck();pos=correct=asked=score=0;current=null;buildTiles();$("play").style.display="block";$("finish").style.display="none";update();show()}
function update(){$("score").textContent=`⭐ ${score} points`;$("right").textContent=`✅ ${correct}/20 correct`;$("asked").textContent=`❓ ${asked} questions`;$("bar").style.width=(correct/20*100)+"%";$("map").dataset.p=Math.floor(correct/2)}
function show(){if(correct>=20)return finish();locked=false;current=nextItem();$("counter").textContent=`Correct answers still needed: ${20-correct}`;$("q").textContent=current.q;$("feedback").textContent="";const box=$("answers");box.innerHTML="";
let opts=current.a.map((t,i)=>({t,ok:i===current.c}));shuffle(opts).forEach((o,i)=>{const b=document.createElement("button");b.className="ans";b.textContent=String.fromCharCode(65+i)+") "+o.t;b.onclick=()=>answer(o.ok,b);box.appendChild(b)})}
function answer(ok,b){if(locked)return;locked=true;asked++;document.querySelectorAll(".ans").forEach(x=>x.disabled=true);sound(ok);
if(ok){correct++;score+=10;b.classList.add("correct");const tile=$("coverTile"+(correct-1));if(tile){tile.classList.add("open");$("tiles20").style.background="transparent";}$("feedback").textContent=`✅ Correct! +10 points. Square ${correct} of 20 uncovered.`}
else{score-=5;b.classList.add("wrong");$("feedback").textContent="❌ Wrong! −5 points. Here is a new question."}
update();setTimeout(show,1050)}
function finish(){document.querySelectorAll(".coverTile").forEach(x=>x.classList.add("open"));const g=$("giftWrap");g.classList.add("show");setTimeout(()=>g.classList.add("open"),500);setTimeout(()=>g.classList.remove("show"),2100);$("play").style.display="none";$("finish").style.display="block";$("bar").style.width="100%";$("result").innerHTML=`You answered <b>20 questions</b> correctly out of <b>${asked}</b> questions in total.<br>Final score: <b>${score} points</b>.<br>The path is fully uncovered and the treasure chest is yours!`}
$("restart").onclick=start;start();
</script></body></html>
