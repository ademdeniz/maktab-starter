<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17130b">
<title>Maktab Detective</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#3d3115,#14110b 58%);color:#fff;min-height:100vh}
.app{max-width:720px;margin:auto;padding:12px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
.top{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.brand{font-weight:900;font-size:clamp(21px,5vw,34px);color:#f7d66d;letter-spacing:.3px} .sig{font-size:12px;color:#d9cda9}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end} .pill{background:#292116;border:1px solid #705b28;border-radius:999px;padding:6px 9px;font-weight:800;font-size:13px}
.case{background:linear-gradient(145deg,#241d12,#17130d);border:1px solid #8a6e2e;border-radius:18px;padding:13px;box-shadow:0 8px 30px #0007}
.casehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px} .badge{font-size:13px;color:#f7d66d;font-weight:800} .score{font-size:24px;font-weight:1000;color:#f7d66d}
.clues{display:grid;gap:7px} .clue{display:flex;gap:9px;align-items:flex-start;background:#302718;border:1px solid #574621;border-radius:12px;padding:9px 10px;font-size:15px;line-height:1.3} .num{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#c9a441;color:#161109;font-weight:1000} .locked{opacity:.32;filter:grayscale(1)} 
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px} button{min-height:48px;border:0;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer} .hint{background:#f0c95c;color:#201807} .guess{background:#176b45;color:white} .restart{background:#403729;color:#fff;border:1px solid #6f6048}
.answers{display:none;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px} .answers.show{display:grid} .ans{background:#efe6cf;color:#231c11;border:2px solid transparent;padding:9px;min-height:54px} .ans:active{transform:scale(.98)} .ans.good{background:#bfe9c9;border-color:#27834c} .ans.bad{background:#f2c1bd;border-color:#a43b32}
.msg{min-height:24px;text-align:center;font-weight:800;margin-top:7px;color:#f5df9c} .foot{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;color:#bfb49a;font-size:12px;padding-bottom:8px}
.overlay{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:18px;z-index:5} .overlay.show{display:grid} .modal{width:min(92vw,470px);background:#201a11;border:2px solid #b8953c;border-radius:20px;padding:20px;text-align:center} .modal h2{color:#f7d66d;margin:0 0 8px} .modal button{width:100%;margin-top:10px;background:#f0c95c;color:#201807}
@media(max-width:430px){.app{padding:8px;gap:7px}.case{padding:10px}.clue{padding:7px 8px;font-size:14px}.actions{gap:6px}button{min-height:44px;font-size:14px}.answers{gap:5px}.ans{min-height:48px;padding:6px;font-size:13px}}
</style>
<style>body{flex-wrap:wrap;align-content:flex-start}.bz-brand{flex:0 0 calc(100% - 20px);background:#fff;border:3px solid #c99b3b;border-radius:18px;padding:8px 12px;margin:10px auto;max-width:880px;width:calc(100% - 20px);box-sizing:border-box;text-align:center}.bz-brand img{display:block;width:100%;max-width:760px;height:auto;margin:auto}</style></head>

t is one of the main acts of worship (ibadah) in Islam.", "It is performed at a set time.", "It is connected with Makkah.", "Tawaf and sa’y are done during it.", "Standing at Arafat is its most important rite."]}, {"id": 25, "answer": "Kalimah ash-Shahadah", "clues": ["It is one of the foundations of Islam.", "It is made up of two testimonies.", "It confirms belief in the One Allah.", "It confirms the prophethood of Muhammad (SAW).", "It is the first pillar of Islam."]}, {"id": 26, "answer": "Wudu (ablution)", "clues": ["It is a ritual purification.", "It is connected with getting ready for Salah.", "It is usually done with water.", "In it you wash the face, hands and feet and wipe the head.", "It gives the minor ritual purity."]}, {"id": 27, "answer": "Ghusl", "clues": ["It is a ritual purification.", "Water is used for it.", "It is required in certain situations.", "In the Hanafi madhhab it has three fard parts.", "In it the whole body is washed."]}, {"id": 28, "answer": "Tayammum", "clues": ["It is a ritual purification.", "It is connected with getting ready for Salah.", "It is an easier way allowed in special situations.", "It is not done with water.", "It is done with clean earth when there is a valid reason."]}, {"id": 29, "answer": "Adhan", "clues": ["It is connected with Salah.", "It is made up of set words.", "The Shahadah is said in it.", "The mu’adhdhin calls it.", "It is the call to prayer."]}, {"id": 30, "answer": "Iqamah", "clues": ["It is connected with Salah.", "It is made up of set words.", "It is similar to the Adhan.", "It is said right before the fard prayer starts.", "It announces that the prayer is starting."]}, {"id": 31, "answer": "Mosque (masjid)", "clues": ["It is a place connected with worship.", "Muslims gather in it.", "In it the Qur’an is recited and Salah is prayed.", "It has a mihrab and a minbar.", "It is the Muslim house of worship."]}, {"id": 32, "answer": "Ka’bah", "clues": ["It is in Makkah.", "It is connected with Salah and Hajj.", "Tawaf is done around it.", "Ibrahim and Isma’il (AS) raised its foundations.", "Muslims face towards it in Salah."]}, {"id": 33, "answer": "Qiblah", "clues": ["It is connected with Salah.", "It is important to Muslims all over the world.", "The mihrab shows its direction.", "It is connected with Makkah.", "It is the direction towards the Ka’bah."]}, {"id": 34, "answer": "Mihrab", "clues": ["It is found in a mosque.", "It is connected with Salah.", "It is at the front of the prayer area.", "It helps you know the direction of the Qiblah.", "It is the place in front of which the imam leads the prayer."]}, {"id": 35, "answer": "Minbar", "clues": ["It is found in a mosque.", "It is connected with the imam.", "It has steps.", "It is used especially on Fridays.", "The khutbah (sermon) is given from it."]}, {"id": 36, "answer": "Ramadan", "clues": ["It is one of the months of the Hijri (Islamic) calendar.", "It is especially important to Muslims.", "In it people do more worship.", "The revelation of the Qur’an began in it.", "In it Muslims do the obligatory fast."]}, {"id": 37, "answer": "Laylat al-Qadr", "clues": ["It is a special night.", "It is in Ramadan.", "People worship a lot on this night.", "The revelation of the Qur’an began in it.", "It is better than a thousand months."]}, {"id": 38, "answer": "Eid al-Fitr (Ramadan Eid)", "clues": ["It is a Muslim holiday.", "It comes after a special act of worship.", "It begins with a special Eid prayer.", "It comes after the end of Ramadan.", "It marks the end of the Ramadan fast."]}, {"id": 39, "answer": "Eid al-Adha (Qurbani Eid)", "clues": ["It is a Muslim holiday.", "It begins with a special Eid prayer.", "It is connected with Hajj.", "It is connected with Ibrahim and Isma’il (AS).", "In its days the Qurbani (sacrifice) is offered."]}, {"id": 40, "answer": "Jannah (Paradise)", "clues": ["It is mentioned in the Qur’an.", "It is connected with the Akhirah (the Hereafter).", "In it there is no death and no sadness.", "Al eans leaving the sin and deciding not to go back to it.", "It means repenting to Allah."]}, {"id": 56, "answer": "Sajdah", "clues": ["It is part of Salah.", "It is done in every rak’ah.", "It shows humility before Allah.", "The forehead is put down on the ground.", "It is done twice in each rak’ah."]}, {"id": 57, "answer": "Ruku’", "clues": ["It is part of Salah.", "It is done in every rak’ah.", "It comes after standing (qiyam) and reciting.", "The body bends and the hands are put on the knees.", "It is done once in each rak’ah."]}, {"id": 58, "answer": "Qiyam", "clues": ["It is part of Salah.", "It is connected with reciting the Qur’an.", "It comes before ruku’.", "The person praying stands upright.", "It means standing in Salah."]}, {"id": 59, "answer": "Rak’ah", "clues": ["It is part of Salah.", "Different prayers have a different number of them.", "It includes qiyam, ruku’ and sajdahs.", "The fard of Fajr has two of them and the fard of Dhuhr has four.", "It is the basic unit of Salah."]}, {"id": 60, "answer": "Al-Fatihah", "clues": ["It is a surah of the Qur’an.", "It is recited very often.", "It has seven ayat.", "In it we ask for guidance to the Straight Path.", "It is the first surah in the Qur’an."]}, {"id": 61, "answer": "Al-Ikhlas", "clues": ["It is a surah of the Qur’an.", "It is short and comes near the end of the Qur’an.", "It is about Allah.", "It begins with the words “Qul huwallahu ahad”.", "It has four ayat."]}, {"id": 62, "answer": "Al-Falaq", "clues": ["It is a surah of the Qur’an.", "It is short and comes near the end of the Qur’an.", "In it we ask Allah for protection.", "It mentions the Lord of daybreak.", "It comes right before Surah An-Nas."]}, {"id": 63, "answer": "An-Nas", "clues": ["It is a surah of the Qur’an.", "It is short and comes near the end of the Qur’an.", "In it we ask Allah for protection.", "It mentions the Lord, King and God of mankind.", "It is the last surah in the Qur’an."]}, {"id": 64, "answer": "Al-Kafirun", "clues": ["It is a surah of the Qur’an.", "It is a short surah.", "It begins with the command “Say”.", "It is about clearly separating belief from disbelief.", "It begins with the words “Qul ya ayyuhal-kafirun”."]}, {"id": 65, "answer": "Al-Kawthar", "clues": ["It is a surah of the Qur’an.", "It is very short.", "It has three ayat.", "It mentions prayer and sacrifice.", "It begins with the words “Inna a’taynakal-kawthar”."]}, {"id": 66, "answer": "Al-Asr", "clues": ["It is a surah of the Qur’an.", "It is very short.", "It has three ayat.", "It talks about time, faith, good deeds, truth and patience.", "It begins with an oath by time."]}, {"id": 67, "answer": "Zamzam", "clues": ["It is connected with Makkah.", "It is connected with Hajar and Isma’il (AS).", "It is near the Ka’bah.", "Pilgrims and visitors drink it.", "It is a well-known blessed water."]}, {"id": 68, "answer": "Safa and Marwah", "clues": ["They are in Makkah.", "They are connected with Hajar and Isma’il (AS).", "They are connected with Hajj and Umrah.", "Sa’y is done between them.", "Hajar went back and forth between them looking for water."]}, {"id": 69, "answer": "Arafat", "clues": ["It is connected with Hajj.", "It is near Makkah.", "Many du’as are made there.", "Staying there is the most important rite of Hajj.", "Pilgrims stay there on the 9th of Dhul-Hijjah."]}, {"id": 70, "answer": "Tawaf", "clues": ["It is connected with Hajj and Umrah.", "It is done in Makkah.", "It has seven circuits.", "It is done around one building.", "It is walking around the Ka’bah."]}, {"id": 71, "answer": "Sa’y", "clues": ["It is connected with Hajj and Umrah.", "It is done in Makkah.", "It has seven laps.", "It reminds us of Hajar searching for water.", "It is done between Safa and Marwah."]}, {"id": 72, "answer": "Ihram", "clues": ["It is connected with Hajj and Umrah.", "It is a special state of worship.", "It has special rules and things that are not allowed.", "Men wear two unstitched pieces of cloth.", "You enter it with the intention for Hajj or Umrah."]}, {"id": 73, "answer": "Fajr prayer", "clues": ["It is one of the five daily prayers.", "It has a Sunnah and a fard part.", "Its fard part has two rak’ahs.", "It is prayed before sunrise.", "It is the first daily prayer."]}, {"id": 74, "answer": "Dhuhr prayer", "clues": ["It is one of the five daily prayers.", "Its fard part has four rak’ahs.", "It comes after Fajr.", "It comes before Asr.", "It is prayed after the sun passes its highest point."]}, {"id": 75, "answer": "Asr prayer", "clues": ["It is one of the five daily prayers.", "Its fard part has four rak’ahs.", "It comes after the Dhuhr prayer.", "It comes before Maghrib.", "It is prayed in the later part of the day."]}, {"id": 76, "answer": "Maghrib prayer", "clues": ["It is one of the five daily prayers.", "It comes after Asr.", "It comes before Isha.", "Its fard part has three rak’ahs.", "Its time begins at sunset."]}, {"id": 77, "answer": "Isha prayer", "clues": ["It is one of the five daily prayers.", "Its fard part has four rak’ahs.", "It comes after Maghrib.", "It is connected with the Witr prayer, which is prayed after it.", "It is the last of the five daily prayers."]}, {"id": 78, "answer": "Witr prayer", "clues": ["It is a prayer.", "It is prayed at night.", "It is connected with Isha.", "In the Hanafi madhhab it has three rak’ahs.", "In the third rak’ah the Qunut du’a is recited."]}, {"id": 79, "answer": "Jumu’ah prayer", "clues": ["It is a special prayer.", "It is prayed in congregation (jama’ah).", "It is connected with the khutbah.", "Its fard part has two rak’ahs.", "It is prayed on Fridays."]}, {"id": 80, "answer": "Tarawih prayer", "clues": ["It is a special prayer.", "It is prayed at night.", "It is prayed in congregation or alone.", "It is connected with a special month.", "It is prayed during Ramadan."]}, {"id": 81, "answer": "Du’a", "clues": ["It is an act of worship (ibadah).", "It can be made on many different occasions.", "With it a servant speaks to Allah.", "In it you can ask for help, forgiveness and good things.", "It is a request made to Allah."]}, {"id": 82, "answer": "Dhikr", "clues": ["It is an act of worship (ibadah).", "It can be done with the tongue and the heart.", "It is connected with remembering Allah.", "Tasbih, tahmid and takbir are part of it.", "It means remembering Allah."]}, {"id": 83, "answer": "Tasbih", "clues": ["It is connected with dhikr.", "It is said after Salah and at other times.", "With it Allah is glorified.", "It is often repeated 33 times after the fard prayer.", "It is said as “Subhanallah”."]}, {"id": 84, "answer": "Sadaqah (charity)", "clues": ["It is a good deed.", "It is connected with giving and helping.", "It can be voluntary.", "It is not the same as the obligatory Zakah.", "It can be given to the poor and needy to please Allah."]}, {"id": 85, "answer": "Halal", "clues": ["It is an Islamic term.", "It refers to actions, food and other things.", "It is the opposite of haram.", "It means what the religion permits.", "It means allowed."]}, {"id": 86, "answer": "Haram", "clues": ["It is an Islamic term.", "It refers to actions, food and other things.", "It is the opposite of halal.", "A believer should stay away from it.", "It means strictly forbidden."]}, {"id": 87, "answer": "Sunnah", "clues": ["It is an Islamic term.", "It is connected with Muhammad (SAW).", "It includes his practice and guidance.", "Muslims follow it together with the Qur’an.", "It means the practice and way of the Prophet (SAW)."]}, {"id": 88, "answer": "Hadith", "clues": ["It is an Islamic term.", "It is connected with Muhammad (SAW).", "The Companions and later narrators passed it on.", "It can be about the words, actions or approvals of the Prophet (SAW).", "It is a report about the Prophet (SAW)."]}, {"id": 89, "answer": "The Companions (Sahabah)", "clues": ["They lived in the time of Muhammad (SAW).", "They believed in his prophethood.", "They learned the religion directly from him.", "They helped spre const MAX_ROUNDS=20;
let deck=[],round=0,total=0,current=null,revealed=1,casePoints=100,locked=false;
const $=s=>document.querySelector(s);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){deck=shuffle([...DB]).slice(0,MAX_ROUNDS);round=0;total=0;$("#total").textContent=0;nextCase()}
function nextCase(){
 if(round>=MAX_ROUNDS){showModal("Detective mission complete!","You scored "+total+" points in 20 cases.","Play again",start);return}
 current=deck[round];round++;revealed=1;casePoints=100;locked=false;
 $("#round").textContent=round;$("#value").textContent=casePoints;$("#msg").textContent="The first clue is revealed. You can guess now or ask for a new clue.";
 $("#answers").classList.remove("show");$("#answers").innerHTML="";renderClues(); $("#next").disabled=false; $("#guess").disabled=false;
}
function renderClues(){
 $("#clues").innerHTML=current.clues.map((c,i)=>`<div class="clue ${i<revealed?"":"locked"}"><span class="num">${i+1}</span><span>${i<revealed?escapeHtml(c):"Clue locked"}</span></div>`).join("");
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
$("#next").addEventListener("click",()=>{if(locked)return;if(revealed<5){revealed++;casePoints=Math.max(20,100-(revealed-1)*20);$("#value").textContent=casePoints;renderClues();if(revealed===5)$("#next").disabled=true}});
$("#guess").addEventListener("click",()=>{if(locked)return;showAnswers()});
function showAnswers(){
 let others=shuffle(DB.filter(x=>x.id!==current.id)).slice(0,5);
 let opts=shuffle([current,...others]);
 $("#answers").innerHTML=opts.map(x=>`<button class="ans" data-id="${x.id}">${escapeHtml(x.answer)}</button>`).join("");
 $("#answers").classList.add("show");
 [...document.querySelectorAll(".ans")].forEach(b=>b.addEventListener("click",answer));
}
function answer(e){
 if(locked)return;locked=true;
 const id=Number(e.currentTarget.dataset.id),ok=id===current.id;
 [...document.querySelectorAll(".ans")].forEach(b=>{b.disabled=true;if(Number(b.dataset.id)===current.id)b.classList.add("good")});
 if(ok){total+=casePoints;$("#total").textContent=total;$("#msg").textContent="✅ Case solved! +"+casePoints+" points.";setTimeout(()=>showModal("Case solved!","The correct answer is: "+current.answer+". You earned: "+casePoints+" points.","Next case",nextCase),450)}
 else{e.currentTarget.classList.add("bad");$("#msg").textContent="❌ Wrong lead! This case is lost.";setTimeout(()=>showModal("Case not solved","The correct answer is: "+current.answer+". No points for this case.","New case",nextCase),550)}
}
let modalCb=null;
function showModal(t,txt,btn,cb){$("#modalTitle").textContent=t;$("#modalText").textContent=txt;$("#continue").textContent=btn;modalCb=cb;$("#overlay").classList.add("show")}
$("#continue").addEventListener("click",()=>{$("#overlay").classList.remove("show");if(modalCb)modalCb()});
$("#restart").addEventListener("click",()=>{showModal("New game?","Your current score will be erased.","Start a new game",start)});
start();
</script>
