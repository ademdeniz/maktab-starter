<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>The Little Bee Collects Honey – A3</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#fff5c8;color:#30200b}
.app{max-width:760px;margin:auto;min-height:100vh;padding:6px}
.head{background:linear-gradient(#ffe87b,#ffc928);border:3px solid #75440b;border-radius:17px;padding:5px 8px;text-align:center;box-shadow:0 3px 8px #0003}
h1{margin:0;font-size:clamp(21px,5.8vw,32px);color:#6a3900}.sub{font-weight:900;font-size:12px}.stats{display:flex;gap:5px;justify-content:space-around;font-weight:900;font-size:13px;margin-top:3px}
.scene{height:185px;margin:5px 0;border:3px solid #75440b;border-radius:17px;overflow:hidden;position:relative;background:#dff5ff}
.house{position:absolute;right:0;top:0;width:58%;height:100%;object-fit:cover;object-position:center}
.meadow{position:absolute;left:0;bottom:0;width:48%;height:100%;background:linear-gradient(#c9efff 0 50%,#75c84d 50%)}
.flowers{position:absolute;left:1%;bottom:4px;font-size:31px;letter-spacing:1px;width:44%;line-height:1.1}
.bee{position:absolute;left:4%;top:50px;width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:50% 35%;z-index:4;filter:drop-shadow(0 3px 3px #0005);transition:.2s}
.bee.fly{animation:toHouse 1.8s cubic-bezier(.2,.7,.2,1)}
@keyframes toHouse{0%{left:4%;top:70px;transform:rotate(-8deg) scale(1)}25%{left:18%;top:28px;transform:rotate(5deg) scale(.96)}55%{left:39%;top:73px;transform:rotate(-4deg) scale(.88)}82%{left:61%;top:44px;transform:rotate(3deg) scale(.76)}100%{left:75%;top:92px;transform:rotate(0) scale(.65)}}
.card{background:#fff;border:3px solid #75440b;border-radius:17px;padding:8px;box-shadow:0 3px 8px #0002}.q{font-weight:950;text-align:center;font-size:clamp(16px,4.3vw,21px);min-height:45px;display:grid;place-items:center}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:6px}.ans{background:#fff2a6;border:2px solid #8b570e;border-radius:12px;padding:8px 5px;font-weight:800;min-height:47px;font-size:13px}.ans.ok{background:#b9ed91}.ans.bad{background:#ffaea5}.msg{text-align:center;min-height:20px;font-size:13px;font-weight:900;margin-top:3px}
.combWrap{margin-top:5px;background:#6c410d;border-radius:15px;padding:5px}.combTitle{text-align:center;color:#fff7ce;font-weight:950;font-size:13px;margin-bottom:3px}
.comb{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}.hex{aspect-ratio:1/.88;clip-path:polygon(25% 6%,75% 6%,100% 50%,75% 94%,25% 94%,0 50%);background:#ffe98b;display:grid;place-items:center;font-size:clamp(12px,3.5vw,21px);transition:.35s}.hex.full{background:linear-gradient(135deg,#ffe14b,#e58b00);animation:fill .55s ease}@keyframes fill{50%{transform:scale(1.3)}}
.end{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:20;padding:20px}.end.show{display:grid}.endbox{max-width:400px;background:#fff2a4;border:5px solid #74430a;border-radius:24px;padding:20px;text-align:center}.endbox button{border:0;border-radius:12px;padding:10px 17px;font-weight:900;background:#efad18}
@media(max-width:430px){.scene{height:150px}.bee{width:58px;height:58px}.answers{gap:4px}.ans{padding:6px 4px;min-height:44px}.card{padding:6px}.combWrap{padding:4px}.head{padding:4px}}
