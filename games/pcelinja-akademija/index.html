const $=id=>document.getElementById(id);let deck=[],index=0,score=0,locked=false,audio;
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sound(ok){try{audio??=new (window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type='sine';o.frequency.setValueAtTime(ok?650:250,audio.currentTime);o.frequency.exponentialRampToValueAtTime(ok?950:160,audio.currentTime+.15);g.gain.setValueAtTime(.09,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.start();o.stop(audio.currentTime+.21)}catch(e){}}
function show(id){for(const x of ['start','game','end'])$(x).classList.toggle('hidden',x!==id)}
function flowers(){let n=Math.min(deck.length,8);$('flowers').innerHTML=Array.from({length:n},(_,i)=>'<span class="flower" id="flower'+i+'">'+['🌻','🌼','🌷','🌺','🌸'][i%5]+'</span>').join('')}
function render(){if(index>=deck.length){finish();return}let q=deck[index];$('step').textContent='Flower '+(index+1)+' / '+deck.length;$('tag').textContent='Question from level '+q.level;$('question').textContent=q.q;$('score').textContent='🍯 '+score;$('bar').style.width=(index/deck.length*100)+'%';$('status').textContent='Choose the right answer!';$('answers').innerHTML='';locked=false;let opts=shuffle(q.a.map((v,i)=>({v,correct:i===q.c})));opts.forEach((o,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+') '+o.v;b.onclick=()=>answer(b,o.correct,opts);$('answers').append(b)});$('bee').style.left=(6+(index%8)*9)+'%';$('bee').style.top=(index%2?18:36)+'px';document.querySelectorAll('.flower').forEach((f,i)=>f.classList.toggle('done',i<index%8))}
function answer(button,correct){if(locked)return;locked=true;let q=deck[index];for(let b of $('answers').children)b.disabled=true;button.classList.add(correct?'good':'bad');if(!correct){for(let b of $('answers').children){if(b.textContent.slice(3)===q.a[q.c])b.classList.add('good')}}else{score++;$('counter').textContent='🍯 '+score;$('honey').textContent=score+' jars'}sound(correct);$('status').textContent=correct?'✅ Correct! The bee collected some honey!':'❌ Wrong. The right answer is shown in green.';setTimeout(()=>{index++;render()},correct?1100:1900)}
function finish(){show('end');$('bar').style.width='100%';$('bee').style.left='80%';$('summary').textContent='You collected '+score+' of '+deck.length+' jars of honey! Right answers: '+score+', wrong: '+(deck.length-score)+'. Score: '+Math.round(score/deck.length*100)+'%.'}
$('downloadBtn').onclick=()=>{const html='<!doctype html>\n'+document.documentElement.outerHTML;const blob=new Blob([html],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='bee-academy-A1-A2.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)};$('startBtn').onclick=()=>{let pool=BANK.filter(q=>$('level').value==='mix'||q.level===$('level').value);let n=$('count').value==='all'?pool.length:Math.min(Number($('count').value),pool.length);deck=shuffle(pool).slice(0,n);index=score=0;$('counter').textContent='🍯 0';$('honey').textContent='0 jars';flowers();show('game');render()};$('again').onclick=()=>show('start');$('bankInfo').textContent='Includes '+BANK.length+' questions from Levels A1 and A2. Works without the internet.';
</script></body></html>
